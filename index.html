<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <meta name="theme-color" content="#0f766e">
  <meta name="description" content="Portfolio of Abidur Rahman Joy - D. Agriculturist, Batch Designer, and Digital Creator.">
  <meta name="keywords" content="Abidur Rahman Joy, Batch Designer in Habiganj, Batch Designer in Sylhet, Batch Designer in Bangladesh, Batch Designer Worldwide, Agriculturist, Digital Marketing, Graphic Design, Portfolio">
  <title>Abidur Rahman Joy — Portfolio</title>
  <link rel="icon" href="assets/favicon.svg">
  <link rel="stylesheet" href="style.css">

  <script type="text/javascript">
    (function(c,l,a,r,i,t,y){
        c[a]=c[a]||function(){(c[a].q=c[a].q||[]).push(arguments)};
        t=l.createElement(r);t.async=1;t.src="https://www.clarity.ms/tag/ylpliakus2";
        y=l.getElementsByTagName(r)[0];y.parentNode.insertBefore(t,y);
    })(window, document, "clarity", "script");
  </script>
</head>
<body>
<header class="nav">
  <a class="brand" id="brand" href="#home">Joy<span>.</span></a>
  <button id="menuBtn" class="icon-btn" aria-label="Menu">☰</button>
  <nav id="navLinks">
    <span id="navItems"></span>
    <button id="adminBtn" class="admin-btn">🔐 Admin</button>
  </nav>
</header>

<main>
  <section id="home" class="hero section">
    <div class="hero-text">
      <p class="eyebrow" id="heroEyebrow"></p>
      <h1 id="heroName">Loading...</h1>
      <p id="heroTagline"></p>
      <div class="actions"><a class="btn primary" id="btn1" href="#projects"></a><a class="btn" id="btn2" href="#contact"></a></div>
    </div>
    <div class="hero-photo"><img id="profileImage" src="assets/profile-placeholder.svg" alt="Profile"></div>
  </section>

  <!-- All other sections are generated from the database -->
  <div id="sections"></div>
</main>

<footer><span id="footerName">Abidur Rahman Joy</span> · <span id="footerText"></span> · <span id="year"></span></footer>

<div id="adminModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close aria-label="Close">×</button>

    <div id="loginView">
      <p class="eyebrow">Private area</p><h2>Admin login</h2>
      <p class="muted">শুধু আপনার Firebase অ্যাকাউন্ট দিয়েই এডিট করা যাবে।</p>
      <input id="email" type="email" placeholder="Email" autocomplete="username">
      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" class="btn primary full">Login</button>
      <p id="loginMsg" class="msg"></p>
    </div>

    <div id="dashboardView" class="hidden">
      <div class="dash-head">
        <div><p class="eyebrow">Dashboard</p><h2>Edit portfolio</h2></div>
        <div class="btnrow"><button id="backupBtn" class="btn">⬇ Backup</button><button id="logoutBtn" class="btn">Logout</button></div>
      </div>
      <div id="editor"></div>
      <div class="save">
        <button class="btn primary full" id="saveAll">💾 Save all changes</button>
        <p id="saveMsg" class="msg"></p>
      </div>
    </div>
  </div>
</div>

<script type="module" src="app.js"></script>
</body>
</html>
