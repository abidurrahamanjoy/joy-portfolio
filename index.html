<body>

<main>
  <section id="home" class="hero">
    <div class="blob b1" aria-hidden="true"></div>

      <div class="hero-text">
        <p class="eyebrow" id="heroEyebrow"></p>
        <span class="greet"><svg class="brush" viewBox="0 0 300 90" preserveAspectRatio="none" aria-hidden="true"><path d="M8 55 C40 20,120 15,150 35 C190 60,230 15,290 45 C260 75,150 85,90 70 C50 60,20 68,8 55 Z" fill="currentColor"/></svg><span class="script">Hello!</span></span>

        <div class="actions"><a class="btn primary" id="btn1" href="#projects"></a><a class="btn" id="btn2" href="#contact"></a></div>
      </div>
    </div>
  </section>

<div id="adminModal" class="modal hidden">
  <div class="modal-card">
    <button class="close" data-close aria-label="Close">×</button>

    <div id="loginView">
      <p class="eyebrow">Private area</p><h2>Admin login</h2>

      <input id="password" type="password" placeholder="Password" autocomplete="current-password">
      <button id="loginBtn" class="btn primary full">Login</button>
      <p id="loginMsg" class="msg"></p>
    </div>

    <div id="dashboardView" class="hidden">
      <div class="dash-head">
        <div><p class="eyebrow">Admin dashboard</p><h2>সাইট এডিট করুন</h2></div>

        <button class="btn primary" id="saveAll">💾 Save all changes</button>

    </div>
